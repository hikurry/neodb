<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>NeoDB Search</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <!-- Header -->
    <header class="header">

      <div class="logo">◌</div>

      <div class="header-content">

        <div>

          <h1>NeoDB Search</h1>

          <p>Find something worth reading or watching.</p>

        </div>

        <!-- Auth Status -->
        <div
          id="authStatus"
          class="auth-status"
        ></div>

      </div>

    </header>


    <!-- Login -->
    <section
      id="authSection"
      class="auth-section"
    >

      <div class="auth-card">

        <h2>Sign in</h2>

        <div class="auth-form">

          <input
            id="emailInput"
            type="email"
            placeholder="Email"
            autocomplete="email"
          >

          <input
            id="passwordInput"
            type="password"
            placeholder="Password"
            autocomplete="current-password"
          >

          <button id="signInButton">
            Sign in
          </button>

        </div>

        <p
          id="authMessage"
          class="auth-message"
        ></p>

      </div>

    </section>


    <!-- App Content -->
    <div
      id="appContent"
      class="app-content"
      hidden
    >

      <!-- Search -->
      <section class="search-section">

        <div class="search-bar">

          <input
            id="searchInput"
            type="text"
            placeholder="Search NeoDB..."
            autocomplete="off"
          >

          <button id="searchButton">
            Search
          </button>

        </div>


        <!-- Category -->
        <div class="category-switch">

          <button
            class="category active"
            data-category="book"
          >
            Books
          </button>

          <button
            class="category"
            data-category="movietv"
          >
            Movies & TV
          </button>

        </div>

      </section>


      <!-- Status -->
      <div
        id="status"
        class="status"
      >
        Search for something you love.
      </div>


      <!-- Results -->
      <section
        id="results"
        class="results"
      ></section>

    </div>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="app.js"></script>

</body>
</html>
